<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Level Up — Themed</title>
<style>
:root{
  --wood0:#7a4622; --wood1:#5a3016; --wood2:#3f2010; --woodEdge:#negative;
  --cream0:#f9e9bb; --cream1:#efd8a0; --cream2:#e4c886;
  --ink:#6a3f19; --ink2:#8a5c2c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Baloo 2",Arial,Helvetica,sans-serif;color:#fff}
body{display:grid;place-items:center;min-height:100vh;padding:26px 26px 26px 232px;background:
  radial-gradient(circle at 30% 12%,#3c6b52,#20402f 60%,#122318);}
.app{display:grid;gap:18px;justify-items:center}

/* ---------- demo switcher ---------- */
.controls{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:60;width:188px;display:flex;flex-direction:column;gap:9px;padding:14px;border-radius:18px;background:rgba(255,255,255,.08);box-shadow:0 16px 35px rgba(0,0,0,.3);backdrop-filter:blur(12px)}
.controls strong{margin:0 0 4px;padding-bottom:10px;font-size:13px;line-height:1.35;border-bottom:1px solid rgba(255,255,255,.14)}
.controls .lab{margin-top:5px;font-size:10px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.ctrl{width:100%;text-align:center;border:0;color:#fff;font-weight:900;font-size:13px;padding:11px 14px;border-radius:13px;cursor:pointer;background:linear-gradient(#4b78ff,#2145d6);box-shadow:0 5px 0 #1632a4,0 10px 18px rgba(0,0,0,.22);transition:.12s transform,.12s filter}
.ctrl:hover{filter:brightness(1.06);transform:translateY(-1px)}.ctrl:active{transform:translateY(3px);box-shadow:0 2px 0 #1632a4}
.ctrl.gray{background:linear-gradient(#69758f,#434e67);box-shadow:0 5px 0 #2d364b}
.ctrl.active{background:linear-gradient(#ffc650,#f28c16);box-shadow:0 5px 0 #a95d09}
.ctrlRow{display:flex;gap:8px}.ctrlRow .ctrl{flex:1;padding:10px 6px}

/* ---------- stage ---------- */
.dock{display:flex;flex-direction:column;align-items:center;gap:16px}

/* ---------- wooden frame ---------- */
.popup{position:relative;width:412px;height:612px;border-radius:34px;padding:15px;
  background:linear-gradient(#7c4826,#4c2813);
  box-shadow:0 16px 0 #331909,0 34px 60px rgba(0,0,0,.5),
    inset 0 0 0 3px rgba(168,108,54,.7),inset 0 4px 0 rgba(205,145,80,.55),inset 0 -6px 0 rgba(40,20,8,.5);
  transform:scale(.8);opacity:0;transform-origin:50% 50%}
.popup.open{opacity:1;animation:pop .36s cubic-bezier(.2,.85,.25,1) forwards}
.popup.closing{animation:popClose .24s ease-in forwards}
@keyframes pop{0%{opacity:0;transform:scale(.72)}55%{opacity:1;transform:scale(1.05)}78%{transform:scale(.986)}100%{opacity:1;transform:scale(1)}}
@keyframes popClose{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.82)}}
.field{position:relative;height:100%;border-radius:22px;padding:0 20px 20px;display:flex;flex-direction:column;overflow:visible;
  background:linear-gradient(#f8e8b8,#ead29a);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -8px 16px rgba(150,100,40,.16),inset 0 0 0 2px rgba(206,155,84,.4)}

/* ---------- X close ---------- */
.xbtn{position:absolute;top:-15px;right:-9px;z-index:30;width:48px;height:48px;border-radius:13px;cursor:pointer;border:0;
  background:linear-gradient(#f4695d,#cf3a2c);
  box-shadow:0 5px 0 #932319,0 9px 14px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.4),inset 0 0 0 2px rgba(255,150,140,.35);
  display:grid;place-items:center;transition:.1s transform,.1s box-shadow}
.xbtn:hover{filter:brightness(1.05)}
.xbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #932319,inset 0 2px 0 rgba(255,255,255,.4)}
.xbtn svg{width:22px;height:22px}

/* ---------- ribbon ---------- */
.ribbon{position:relative;margin:-30px auto 0;width:372px;height:92px;flex:0 0 auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.28));opacity:0}
.ribbon.in{animation:ribIn .34s cubic-bezier(.2,.9,.2,1.2) forwards}
@keyframes ribIn{0%{opacity:0;transform:translateY(-20px) scale(.9)}70%{opacity:1;transform:translateY(2px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
.ribbon svg{position:absolute;inset:0;width:100%;height:100%}
.ribTitle{position:absolute;left:0;right:0;top:26px;text-align:center;z-index:2;
  font-size:38px;font-weight:900;letter-spacing:.5px;color:#fff;
  text-shadow:0 3px 0 #a84e15,0 -2px 0 #a84e15,2px 0 0 #a84e15,-2px 0 0 #a84e15,2px 2px 0 #a84e15,-2px 2px 0 #a84e15,0 6px 7px rgba(70,26,4,.4)}
.ribGleam{position:absolute;top:22px;height:48px;width:46px;left:-70px;z-index:3;pointer-events:none;background:linear-gradient(105deg,transparent,rgba(255,255,255,.8),transparent);filter:blur(5px)}
.ribGleam.go{animation:gleam .7s cubic-bezier(.3,.7,.3,1)}
@keyframes gleam{0%{left:-70px}100%{left:110%}}

/* ---------- body ---------- */
.body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0;gap:14px}

/* ---------- level hex ---------- */
.hexRow{position:relative;display:grid;place-items:center;height:132px;flex:0 0 auto}
.shock{position:absolute;left:50%;top:50%;z-index:2;width:120px;height:120px;transform:translate(-50%,-50%) scale(.5);border-radius:50%;border:5px solid rgba(255,206,90,.9);opacity:0;pointer-events:none}
.shock.go{animation:shock .5s cubic-bezier(.05,.8,.3,1) forwards}
@keyframes shock{0%{opacity:1;transform:translate(-50%,-50%) scale(.42);border-width:7px}100%{opacity:0;transform:translate(-50%,-50%) scale(2.6);border-width:1px}}
.hex{position:relative;z-index:3;width:118px;height:132px;display:grid;place-items:center;opacity:0;transform:scale(.4)}
.hex.in{animation:hexIn .34s cubic-bezier(.2,.9,.2,1.3) forwards}
@keyframes hexIn{0%{opacity:0;transform:scale(.4) rotate(-12deg)}66%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.hex.charge{animation:hexCharge .2s cubic-bezier(.6,0,.9,.3) forwards}
@keyframes hexCharge{0%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(.82) rotate(-3deg);filter:brightness(1.3) drop-shadow(0 0 20px rgba(255,190,70,.85))}}
.hex.slam{animation:hexSlam .46s cubic-bezier(.18,.9,.25,1.15) forwards}
@keyframes hexSlam{0%{opacity:1;transform:scale(.82)}14%{transform:scale(.78)}42%{transform:scale(1.32);filter:brightness(1.12)}66%{transform:scale(.95)}84%{transform:scale(1.04)}100%{opacity:1;transform:scale(1);filter:none}}
.hex svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 0 #a9600d) drop-shadow(0 10px 14px rgba(0,0,0,.25))}
.hexNum{position:relative;z-index:2;font-size:52px;line-height:1;font-weight:900;color:#6a3505;text-shadow:0 2px 0 rgba(255,240,190,.6)}
.hexNum.swap{animation:numSwap .36s cubic-bezier(.2,.9,.25,1.15)}
@keyframes numSwap{0%{transform:translateY(-24px) scale(.55);opacity:0;filter:blur(5px)}50%{opacity:1;filter:blur(0)}70%{transform:translateY(3px) scale(1.2)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

/* ---------- reward chips ---------- */
.chipWrap{position:relative;flex:0 0 auto;padding:11px 12px;border-radius:20px;
  background:linear-gradient(rgba(255,248,214,.75),rgba(255,240,190,.5));
  box-shadow:inset 0 0 0 2px rgba(255,213,110,.6),0 0 20px rgba(255,199,80,.4),0 4px 8px rgba(0,0,0,.06)}
.chipRow{display:flex;justify-content:center;gap:8px}
.chip{position:relative;width:60px;height:66px;border-radius:14px;flex:0 0 auto;cursor:pointer;user-select:none;
  box-shadow:0 4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35);opacity:0;transform:translateY(14px) scale(.9)}
.chip.in{animation:chipIn .3s cubic-bezier(.2,.9,.2,1.3) forwards}
@keyframes chipIn{0%{opacity:0;transform:translateY(16px) scale(.86)}66%{opacity:1;transform:translateY(-4px) scale(1.07)}100%{opacity:1;transform:translateY(0) scale(1)}}
.chip.holding{filter:brightness(1.06)}
.chip .inner{position:absolute;left:5px;right:5px;top:5px;height:41px;border-radius:10px;display:grid;place-items:center;box-shadow:inset 0 2px 5px rgba(0,0,0,.18),inset 0 -2px 0 rgba(255,255,255,.25)}
.chip .icon{width:34px;height:34px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.28))}
.chip .icon svg{width:100%;height:100%;display:block}
.chip .count{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:15px;font-weight:900;color:#fff;
  text-shadow:1px 1px 0 #3a2410,-1px 1px 0 #3a2410,1px -1px 0 #3a2410,-1px -1px 0 #3a2410,0 2px 2px rgba(0,0,0,.3)}
.r-common{background:linear-gradient(#cca26b,#a97e49)}
.r-common .inner{background:linear-gradient(#e0c084,#c39f62)}
.r-rare{background:linear-gradient(#63b3f0,#3f89d5)}
.r-rare .inner{background:linear-gradient(#9ad4f9,#5aa9e6)}
.r-uncommon{background:linear-gradient(#8ccf57,#5fa838)}
.r-uncommon .inner{background:linear-gradient(#b0e277,#7cc24f)}

/* ---------- feature cards ---------- */
.featCard{position:relative;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;flex:0 0 auto;overflow:hidden;
  padding:12px 16px;border-radius:18px;cursor:pointer;user-select:none;min-height:82px;opacity:0;transform:translateY(16px) scale(.96)}
.featCard.in{animation:featIn .34s cubic-bezier(.2,.9,.2,1.15) forwards}
@keyframes featIn{0%{opacity:0;transform:translateY(18px) scale(.94)}66%{opacity:1;transform:translateY(-4px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
.featCard.holding{filter:brightness(1.04)}
.featCard.earned{background:linear-gradient(#fffdf4,#faf0d2);box-shadow:inset 0 0 0 2px rgba(255,214,120,.8),0 6px 12px rgba(0,0,0,.08)}
.featCard.pending{background:linear-gradient(#e3d4af,#d3c091);box-shadow:inset 0 0 0 2px rgba(150,116,64,.3),inset 0 3px 8px rgba(120,88,38,.18)}
.featIcon{width:64px;height:64px;display:grid;place-items:center}
.featIcon svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
.featCard.pending .featIcon svg{filter:grayscale(1) brightness(.92) drop-shadow(0 3px 3px rgba(0,0,0,.16))}
.featKick{font-size:12.5px;font-weight:800;color:#8a6a3a;letter-spacing:.2px}
.featName{margin-top:2px;font-size:24px;font-weight:900;color:#6a3f19;line-height:1.06}
.featCard.earned .featName{margin-top:0}
.laneShine{position:absolute;top:0;bottom:0;width:60px;left:-90px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);filter:blur(6px);pointer-events:none}
.laneShine.go{animation:laneShine .85s ease-out .1s}
@keyframes laneShine{0%{left:-90px}100%{left:118%}}

/* ---------- next-up teaser ---------- */
.teaser{position:relative;display:grid;grid-template-columns:34px 1fr auto;gap:11px;align-items:center;flex:0 0 auto;
  padding:9px 15px;border-radius:14px;cursor:pointer;user-select:none;
  background:linear-gradient(#e3d4af,#d3c091);box-shadow:inset 0 0 0 2px rgba(150,116,64,.24),inset 0 2px 6px rgba(120,88,38,.14);
  opacity:0;transform:translateY(10px)}
.teaser.in{animation:fadeUp .3s ease-out forwards}
.teaser.holding{filter:brightness(1.03)}
.teaserIcon{width:34px;height:34px}
.teaserIcon svg{width:100%;height:100%;display:block;filter:grayscale(1) brightness(.95)}
.teaserKick{font-size:10px;font-weight:900;letter-spacing:1px;color:#8a6a3a}
.teaserName{margin-top:1px;font-size:16px;font-weight:900;color:#6a3f19;line-height:1.05}
.teaserWhen{text-align:right}
.teaserWhen b{font-size:16px;font-weight:900;color:#6a3f19}
.teaserWhen small{display:block;margin-top:1px;font-size:10px;font-weight:800;color:#8a6a3a}

/* ---------- claim ---------- */
.claim{align-self:center;flex:0 0 auto;margin-top:4px;border:0;cursor:pointer;padding:13px 52px;border-radius:16px;
  font-size:22px;font-weight:900;letter-spacing:1.5px;color:#1c5c1c;
  background:linear-gradient(#84dd5c,#48b23c);
  text-shadow:0 1px 0 rgba(255,255,255,.45);
  box-shadow:0 6px 0 #2f8a2b,0 12px 20px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.4);
  opacity:0;transform:translateY(12px);transition:.11s transform,.11s box-shadow}
.claim.in{animation:fadeUp .26s cubic-bezier(.2,.9,.2,1.1) forwards}
.claim.pressed,.claim:active{transform:translateY(4px);box-shadow:0 2px 0 #2f8a2b,0 6px 12px rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.4)}
.claim.nudge{animation:nudge .5s cubic-bezier(.2,.9,.25,1.1) forwards}
@keyframes nudge{0%,100%{opacity:1;transform:translateY(0) scale(1)}30%{opacity:1;transform:translateY(-3px) scale(1.04)}60%{opacity:1;transform:translateY(0) scale(.99)}}

/* ---------- auto-close tag ---------- */
.autoclose{display:inline-flex;align-items:center;gap:10px;padding:9px 30px;
  font-size:16px;font-weight:900;letter-spacing:.3px;color:#fff5e0;
  background:linear-gradient(#6f4222,#4a2b13);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%);
  box-shadow:0 6px 14px rgba(0,0,0,.32);text-shadow:0 1px 0 rgba(0,0,0,.35);opacity:0;transform:translateY(8px)}
.autoclose.in{animation:fadeUp .3s ease-out forwards}
.autoclose svg{width:26px;height:28px;flex:0 0 auto}
.autoclose b{font-variant-numeric:tabular-nums}

/* ---------- fx ---------- */
.fx{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:visible}
.p{position:absolute;left:0;top:0;width:8px;height:8px;border-radius:50%;will-change:transform,opacity}
.p.spark{width:4px;height:15px;border-radius:999px}
.ringFx{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,222,120,.95);box-shadow:0 0 15px rgba(255,196,64,.55);opacity:0}
.flashBloom{position:absolute;left:50%;top:34%;width:460px;height:460px;z-index:38;transform:translate(-50%,-50%) scale(.55);border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.92) 0%,rgba(255,224,130,.6) 26%,rgba(255,180,40,0) 62%);mix-blend-mode:screen}
.flashBloom.go{animation:bloom .3s cubic-bezier(.12,.9,.3,1) forwards}
@keyframes bloom{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}10%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.popup.shake{animation:shake .17s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{0%,100%{transform:scale(1) translate(0,0)}20%{transform:scale(1) translate(-4px,3px)}40%{transform:scale(1) translate(4px,-3px)}60%{transform:scale(1) translate(-3px,-2px)}80%{transform:scale(1) translate(3px,2px)}}

/* ---------- hold-to-peek ---------- */
.infoBubble{position:absolute;z-index:50;width:238px;padding:12px 14px 13px;border-radius:16px;pointer-events:none;opacity:0;transform:translateY(6px) scale(.96);transform-origin:50% 100%;
  background:linear-gradient(#3a2515,#241408);box-shadow:0 12px 26px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,214,140,.28);transition:opacity .16s ease,transform .2s cubic-bezier(.15,.9,.2,1.1)}
.infoBubble.on{opacity:1;transform:translateY(0) scale(1)}
.infoBubble{--arrow:118px}
.infoBubble:after{content:"";position:absolute;left:var(--arrow);bottom:-6px;width:14px;height:14px;margin-left:-7px;border-radius:3px;transform:rotate(45deg);background:#241408}
.ibTitle{font-size:15px;font-weight:900;color:#ffd97a}
.ibMeta{margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.3px;color:#c79a5f}
.ibDesc{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,214,140,.18);font-size:12px;font-weight:600;line-height:1.42;color:#f0e2cd}

.caption{font-size:13px;color:rgba(255,255,255,.72);text-align:center;max-width:760px;line-height:1.55}
@media (max-width:760px){body{padding:22px}.controls{position:static;transform:none;width:min(100%,412px);margin:0 auto 6px}}
@media (prefers-reduced-motion:reduce){.laneShine.go,.ribGleam.go,.claim.nudge,.flashBloom.go,.popup.shake{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="controls">
    <strong>Level Up popup — themed</strong>
    <div class="lab">Versions</div>
    <button class="ctrl active" id="vFeature">Feature unlocked</button>
    <button class="ctrl gray" id="vPlain">No feature</button>
    <div class="lab">Playback</div>
    <button class="ctrl gray" id="replay">Replay</button>
    <div class="ctrlRow">
      <button class="ctrl gray speed active" data-speed="1">1×</button>
      <button class="ctrl gray speed" data-speed="0.55">0.55×</button>
    </div>
  </div>

  <div class="dock">
    <div class="popup" id="popup">
      <button class="xbtn" id="xbtn" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M5 5 L19 19 M19 5 L5 19" stroke="#fff" stroke-width="4.4" stroke-linecap="round" fill="none"/></svg>
      </button>

      <div class="field">
        <div class="ribbon" id="ribbon">
          <svg viewBox="0 0 372 92" preserveAspectRatio="none">
            <defs>
              <linearGradient id="ribFront" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffc45a"/><stop offset=".5" stop-color="#f9a52c"/><stop offset="1" stop-color="#ef8c19"/>
              </linearGradient>
              <linearGradient id="ribTail" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e88c1f"/><stop offset="1" stop-color="#cf7415"/>
              </linearGradient>
            </defs>
            <!-- tails -->
            <path d="M8,30 L64,24 L64,66 L8,60 L24,45 Z" fill="url(#ribTail)" stroke="#a5541a" stroke-width="3" stroke-linejoin="round"/>
            <path d="M364,30 L308,24 L308,66 L364,60 L348,45 Z" fill="url(#ribTail)" stroke="#a5541a" stroke-width="3" stroke-linejoin="round"/>
            <!-- folds -->
            <path d="M64,24 L86,32 L86,60 L64,66 Z" fill="#b5611a" stroke="#a5541a" stroke-width="2" stroke-linejoin="round"/>
            <path d="M308,24 L286,32 L286,60 L308,66 Z" fill="#b5611a" stroke="#a5541a" stroke-width="2" stroke-linejoin="round"/>
            <!-- center band -->
            <path d="M72,18 Q186,10 300,18 L300,74 Q186,82 72,74 Z" fill="url(#ribFront)" stroke="#a5541a" stroke-width="3.4" stroke-linejoin="round"/>
            <path d="M80,24 Q186,17 292,24" fill="none" stroke="#ffd98a" stroke-width="3" stroke-linecap="round" opacity=".85"/>
          </svg>
          <span class="ribGleam" id="ribGleam"></span>
          <div class="ribTitle">Level Up!</div>
        </div>

        <div class="body">
          <div class="hexRow">
            <div class="shock" id="shock"></div>
            <div class="hex" id="hex">
              <svg viewBox="0 0 118 132">
                <defs>
                  <linearGradient id="hexG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ffca55"/><stop offset="1" stop-color="#ef911c"/>
                  </linearGradient>
                </defs>
                <path d="M59,3 L112,33 L112,99 L59,129 L6,99 L6,33 Z" fill="url(#hexG)" stroke="#c8790f" stroke-width="3"/>
                <path d="M59,12 L104,38 L104,58 L59,34 L14,58 L14,38 Z" fill="#fff0c0" opacity=".5"/>
              </svg>
              <div class="hexNum" id="hexNum">28</div>
            </div>
          </div>

          <div class="chipWrap"><div class="chipRow" id="chipRow"></div></div>

          <div class="featCard" id="featCard" style="display:none"><div class="laneShine"></div></div>

          <div class="teaser" id="teaser" style="display:none">
            <div class="teaserIcon" id="teaserIcon"></div>
            <div><div class="teaserKick">NEXT UP</div><div class="teaserName" id="teaserName"></div></div>
            <div class="teaserWhen"><b id="teaserLv"></b><small id="teaserAway"></small></div>
          </div>

          <button class="claim" id="claim">CLAIM</button>
        </div>

        <div class="fx" id="fx"></div>
        <div class="flashBloom" id="flashBloom"></div>
        <div class="infoBubble" id="infoBubble">
          <div class="ibTitle" id="ibTitle"></div>
          <div class="ibMeta" id="ibMeta"></div>
          <div class="ibDesc" id="ibDesc"></div>
        </div>
      </div>
    </div>

    <div class="autoclose" id="autoclose">
      <svg viewBox="0 0 36 40" id="swIcon">
        <rect x="13" y="1" width="10" height="5" rx="2" fill="#e8912a"/>
        <rect x="16.5" y="4" width="3" height="4" fill="#e8912a"/>
        <circle cx="18" cy="23" r="15" fill="#f4a52c" stroke="#b96b12" stroke-width="2.5"/>
        <circle cx="18" cy="23" r="11" fill="#fff4d8"/>
        <path id="swHand" d="M18 23 L18 14" stroke="#b03a1e" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="18" cy="23" r="2" fill="#b03a1e"/>
        <rect x="27" y="6" width="6" height="3.4" rx="1.7" transform="rotate(40 30 8)" fill="#e8912a"/>
      </svg>
      <span>Auto-closes in <b id="acNum">60</b>s</span>
    </div>
  </div>

  <div class="caption">Themed pass — one fixed-size popup, two states. Toggle at left. Hold any chip or card to peek. The tag below counts down 60s, resets on any tap, and the red X or the timer both close it.</div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const popup=$('popup'), field=popup.querySelector('.field'), xbtn=$('xbtn'),
      ribbon=$('ribbon'), ribGleam=$('ribGleam'),
      hex=$('hex'), hexNum=$('hexNum'), shock=$('shock'),
      chipRow=$('chipRow'), featCard=$('featCard'),
      teaser=$('teaser'), teaserIcon=$('teaserIcon'), teaserName=$('teaserName'), teaserLv=$('teaserLv'), teaserAway=$('teaserAway'),
      claim=$('claim'), fx=$('fx'), flashBloom=$('flashBloom'),
      autoclose=$('autoclose'), acNum=$('acNum'), swHand=$('swHand'),
      infoBubble=$('infoBubble'), ibTitle=$('ibTitle'), ibMeta=$('ibMeta'), ibDesc=$('ibDesc');

let speed=1, phase='idle', timers=[], rafs=[], currentLevel=28, variant='feature';
let laneInfo=null, teaserInfo=null;

/* ---------- assets (inline SVG builders) ---------- */
function gemSVG(kind){
  const c = kind==='blue'
    ? {top:'#cdeeff',mid:'#5aa9e6',bot:'#2f74bd',line:'#eaf7ff',edge:'#1f5590'}
    : {top:'#dcffb0',mid:'#7cc24f',bot:'#3f8a24',line:'#f0ffd6',edge:'#2c661a'};
  return `<svg viewBox="0 0 40 40">
    <polygon points="20,4 34,14 29,36 11,36 6,14" fill="${c.mid}" stroke="${c.edge}" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="20,4 34,14 20,19 6,14" fill="${c.top}"/>
    <polygon points="6,14 20,19 11,36" fill="${c.bot}" opacity=".55"/>
    <polygon points="34,14 20,19 29,36" fill="${c.bot}" opacity=".35"/>
    <path d="M20,7 L11,13" stroke="${c.line}" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </svg>`;
}
function shardSVG(){
  return `<svg viewBox="0 0 40 40">
    <path d="M10,15 L25,6 L34,17 L27,31 L12,34 L5,22 Z" fill="#ffcf55" stroke="#c78a12" stroke-width="2" stroke-linejoin="round"/>
    <path d="M10,15 L25,6 L23,17 L12,22 Z" fill="#fff0b8" opacity=".85"/>
    <path d="M23,17 L34,17 L27,31 Z" fill="#e8a01e" opacity=".6"/>
  </svg>`;
}
function iconFor(r){ return r.icon==='shard' ? shardSVG() : gemSVG(r.gem); }

// shop / treasure-chest feature icon
function chestSVG(){
  return `<svg viewBox="0 0 64 64">
    <ellipse cx="32" cy="57" rx="24" ry="4" fill="rgba(0,0,0,.16)"/>
    <!-- lid open -->
    <path d="M12,30 Q32,14 52,30 L52,34 L12,34 Z" fill="#e0574f" stroke="#8f2f28" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M12,30 Q32,16 52,30" fill="none" stroke="#ff8a80" stroke-width="2" opacity=".7"/>
    <!-- interior gold -->
    <rect x="15" y="33" width="34" height="6" rx="3" fill="#ffd85c"/>
    <circle cx="22" cy="35" r="4" fill="#ffe487" stroke="#d99a1c" stroke-width="1.4"/>
    <circle cx="31" cy="34" r="4" fill="#ffe487" stroke="#d99a1c" stroke-width="1.4"/>
    <polygon points="42,30 46,35 42,40 38,35" fill="#ff7ad0" stroke="#c53f96" stroke-width="1.4"/>
    <!-- chest body -->
    <rect x="12" y="38" width="40" height="20" rx="5" fill="#a05a2a" stroke="#6d3a17" stroke-width="2.5"/>
    <rect x="12" y="38" width="40" height="6" fill="#b96c34"/>
    <rect x="28" y="42" width="8" height="12" rx="2" fill="#f4c23e" stroke="#9c6b16" stroke-width="1.6"/>
    <circle cx="32" cy="47" r="2" fill="#7a4a10"/>
    <!-- SHOP tab -->
    <g transform="translate(4,2)">
      <rect x="0" y="0" width="30" height="12" rx="3" fill="#ffd23e" stroke="#c98a10" stroke-width="1.6"/>
      <text x="15" y="9.4" text-anchor="middle" font-family="Arial" font-size="8" font-weight="900" fill="#c0392b">SHOP</text>
    </g>
  </svg>`;
}

/* ---------- data ---------- */
const REWARDS=[
  {icon:'shard',            count:3, name:'Gold Shard',  rar:'common',   desc:'Crafting material used to upgrade gear at the Forge.'},
  {icon:'gem', gem:'blue',  count:1, name:'Sapphire',    rar:'rare',     desc:'Rare gem. Spent on premium summons and rerolls.'},
  {icon:'gem', gem:'green', count:3, name:'Emerald',     rar:'uncommon', desc:'Common gem. Used for everyday upgrades and refills.'},
  {icon:'gem', gem:'green', count:3, name:'Emerald',     rar:'uncommon', desc:'Common gem. Used for everyday upgrades and refills.'},
  {icon:'gem', gem:'green', count:3, name:'Emerald',     rar:'uncommon', desc:'Common gem. Used for everyday upgrades and refills.'}
];
const EARNED = {name:'Merchant Shop', level:28, desc:'Spend gems and shards on rotating gear, boosts and cosmetics.'};
const NEXTUP = {name:'Auction House', level:31, desc:'Bid against other players for rare, time-limited items.'};

/* ---------- plumbing ---------- */
const wait=n=>new Promise(r=>{const id=setTimeout(r,n/speed);timers.push(id)});
const raf=f=>{const id=requestAnimationFrame(f);rafs.push(id);return id};
function clearTimersOnly(){timers.forEach(clearTimeout);timers=[];rafs.forEach(cancelAnimationFrame);rafs=[]}
function clearAll(){clearTimersOnly();fx.innerHTML=''}
function center(el){const r=el.getBoundingClientRect(),p=field.getBoundingClientRect();return{x:r.left-p.left+r.width/2,y:r.top-p.top+r.height/2}}
function bez(a,b,c,d,t){const u=1-t;return u*u*u*a+3*u*u*t*b+3*u*t*t*c+t*t*t*d}
function replay(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function ring(x,y){const e=document.createElement('div');e.className='ringFx';fx.appendChild(e);
  const dur=460/speed,s=performance.now();
  (function f(now){const t=Math.min(1,(now-s)/dur),q=1-Math.pow(1-t,3);
    e.style.transform=`translate(${x-11}px,${y-11}px) scale(${.55+q*2})`;e.style.opacity=1-t;
    if(t<1)raf(f);else e.remove()})(performance.now())}
function theme(e,gold,spark){
  if(gold){e.style.background=spark?'linear-gradient(#fff8d5,#ffd86d,rgba(255,170,46,0))':'radial-gradient(circle at 35% 30%,#fff,#fff3b2 34%,#ffd35d 60%,#ff9e2d 100%)';
    e.style.boxShadow=spark?'0 0 8px rgba(255,207,92,.66)':'0 0 9px rgba(255,214,100,.82)'}
  else{e.style.background=spark?'linear-gradient(#fff,#9feaff,rgba(63,164,255,0))':'radial-gradient(circle at 35% 30%,#fff,#b6efff 32%,#5ecbff 58%,#287cf6 100%)';
    e.style.boxShadow=spark?'0 0 8px rgba(105,216,255,.62)':'0 0 9px rgba(87,205,255,.8)'}}
function burst(from,{count=28,radius=90,dur=760,gold=true}={}){
  for(let i=0;i<count;i++){
    const spark=i%4===0,e=document.createElement('div');e.className='p'+(spark?' spark':'');theme(e,gold,spark);fx.appendChild(e);
    const a=Math.random()*Math.PI*2,r=radius*(.45+Math.random()*.8),D=dur/speed,S=performance.now()+Math.random()*50/speed;
    (function f(now){if(now<S){raf(f);return}
      const t=Math.min(1,(now-S)/D),q=1-Math.pow(1-t,3);
      e.style.transform=`translate(${from.x+Math.cos(a)*r*q}px,${from.y+Math.sin(a)*r*q+t*t*26}px) scale(${1.05-t*.5})`;
      e.style.opacity=t<.1?t/.1:1-t;
      if(t<1)raf(f);else e.remove()})(performance.now());
  }}
function riseAway(from,{count=14,gold=true}={}){
  for(let i=0;i<count;i++){
    const spark=i%3===0,e=document.createElement('div');e.className='p'+(spark?' spark':'');theme(e,gold,spark);fx.appendChild(e);
    const dx=(Math.random()-.5)*70,D=(650+Math.random()*250)/speed,S=performance.now()+Math.random()*120/speed;
    (function f(now){if(now<S){raf(f);return}
      const t=Math.min(1,(now-S)/D),q=1-Math.pow(1-t,3);
      e.style.transform=`translate(${from.x+dx*q}px,${from.y-160*q}px) scale(${1-t*.4})`;
      e.style.opacity=t<.1?t/.1:1-t;
      if(t<1)raf(f);else e.remove()})(performance.now());
  }}
const REDUCED=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function flash(){replay(flashBloom,'go')}
function shake(){if(!REDUCED)replay(popup,'shake')}

/* ---------- 60s auto-close ---------- */
const TIMER_MS=60000;
let timerRAF=null, deadline=0;
function armTimer(){deadline=performance.now()+TIMER_MS;autoclose.classList.add('in');updateTag(TIMER_MS);if(!timerRAF)tickTimer()}
function resetTimer(){if(phase==='ready')deadline=performance.now()+TIMER_MS}
function stopTimer(){if(timerRAF){cancelAnimationFrame(timerRAF);timerRAF=null}}
function updateTag(rem){acNum.textContent=Math.max(0,Math.ceil(rem/1000));swHand.setAttribute('transform',`rotate(${360*(1-rem/TIMER_MS)} 18 23)`)}
function tickTimer(){
  timerRAF=requestAnimationFrame(tickTimer);
  if(phase!=='ready')return;
  const rem=deadline-performance.now();
  updateTag(rem);
  if(rem<=0){stopTimer();dismiss('timeout')}
}

/* ---------- hold-to-peek ---------- */
const OPEN_DELAY=50;
let openTimer=null, holdEl=null, holdOrigin=null;
function showInfo(f,el){
  if(!f)return;
  ibTitle.textContent=f.name;
  if(f.level==null){ibMeta.textContent=f.meta}
  else{const n=f.level-currentLevel;
    ibMeta.textContent=n>0?`Unlocks at Level ${f.level} · ${n} level${n>1?'s':''} away`:`Unlocked at Level ${f.level}`}
  ibDesc.textContent=f.desc;
  infoBubble.classList.add('on');
  requestAnimationFrame(()=>{
    const a=el.getBoundingClientRect(),p=field.getBoundingClientRect(),b=infoBubble.getBoundingClientRect();
    const cx=a.left-p.left+a.width/2;
    const left=Math.max(10,Math.min(p.width-b.width-10,cx-b.width/2));
    infoBubble.style.left=left+'px';
    infoBubble.style.top=Math.max(10,a.top-p.top-b.height-12)+'px';
    infoBubble.style.setProperty('--arrow',Math.max(16,Math.min(b.width-16,cx-left))+'px');
  });
}
function closeInfo(){infoBubble.classList.remove('on');if(holdEl){holdEl.classList.remove('holding');holdEl=null}}
function cancelHold(){if(!holdEl&&!holdOrigin)return;clearTimeout(openTimer);openTimer=null;holdOrigin=null;closeInfo()}
function bindHold(el,getInfo){
  el.addEventListener('pointerdown',e=>{
    if(phase!=='ready')return;
    const f=getInfo();if(!f)return;
    holdOrigin={x:e.clientX,y:e.clientY};clearTimeout(openTimer);
    if(holdEl&&holdEl!==el)holdEl.classList.remove('holding');
    holdEl=el;el.classList.add('holding');
    openTimer=setTimeout(()=>{openTimer=null;showInfo(f,el)},OPEN_DELAY);
  });
}
window.addEventListener('pointerup',cancelHold);
window.addEventListener('pointercancel',cancelHold);
window.addEventListener('pointermove',e=>{if(holdOrigin&&(Math.abs(e.clientX-holdOrigin.x)>6||Math.abs(e.clientY-holdOrigin.y)>6))cancelHold()});
bindHold(featCard,()=>laneInfo);
bindHold(teaser,()=>teaserInfo);
// any tap keeps the popup alive
popup.addEventListener('pointerdown',resetTimer,true);

/* ---------- builders ---------- */
function buildRewards(){
  chipRow.innerHTML='';
  REWARDS.forEach(r=>{
    const c=document.createElement('div');c.className='chip r-'+r.rar;
    c.innerHTML=`<div class="inner"><div class="icon">${iconFor(r)}</div></div><div class="count">${r.count}</div>`;
    bindHold(c,()=>({name:r.name,meta:`×${r.count} · ${r.rar[0].toUpperCase()+r.rar.slice(1)}`,desc:r.desc}));
    chipRow.appendChild(c);
  });
}
function fillLane(feat,earned){
  featCard.style.display='';
  featCard.className='featCard '+(earned?'earned':'pending');
  const away=feat.level-currentLevel;
  const kick = earned ? '' : `<div class="featKick">New Feature in ${away} Level${away>1?'s':''}</div>`;
  featCard.innerHTML=`<div class="laneShine"></div>`+
    `<div class="featIcon">${chestSVG()}</div>`+
    `<div>${kick}<div class="featName">${feat.name}</div></div>`;
  featCard.dataset.earned=earned?'1':'0';
  laneInfo={name:feat.name,level:feat.level,desc:feat.desc};
}
function buildTeaser(nxt){
  if(!nxt){teaser.style.display='none';teaserInfo=null;return}
  const away=nxt.level-currentLevel;
  teaser.style.display='';
  teaserIcon.innerHTML=chestSVG();
  teaserName.textContent=nxt.name;
  teaserLv.textContent='Lv.'+nxt.level;
  teaserAway.textContent=`In ${away} Level${away>1?'s':''}`;
  teaserInfo={name:nxt.name,level:nxt.level,desc:nxt.desc};
}
function buildVersion(){
  if(variant==='feature'){ fillLane(EARNED,true); buildTeaser(NEXTUP); }
  else { fillLane(NEXTUP,false); buildTeaser(null); }
}

/* ---------- reset ---------- */
function reset(){
  clearAll();stopTimer();clearTimeout(openTimer);closeInfo();
  currentLevel=28;
  popup.className='popup';popup.classList.remove('shake');
  ribbon.className='ribbon';ribGleam.className='ribGleam';
  hex.className='hex';hexNum.className='hexNum';shock.className='shock';flashBloom.className='flashBloom';
  autoclose.className='autoclose';acNum.textContent=60;swHand.setAttribute('transform','rotate(0 18 23)');
  claim.className='claim';claim.disabled=false;
  hexNum.textContent=currentLevel-1;
  buildRewards();buildVersion();
  featCard.classList.remove('in','holding');teaser.classList.remove('in','holding');
}

/* ---------- skip ---------- */
function skipToEnd(){
  clearAll();popup.classList.remove('shake');flashBloom.className='flashBloom';
  popup.className='popup open';
  ribbon.className='ribbon in';hex.className='hex slam';
  hexNum.textContent=currentLevel;hexNum.className='hexNum';
  [...chipRow.children].forEach(c=>c.classList.add('in'));
  if(featCard.style.display!=='none')featCard.classList.add('in');
  if(teaser.style.display!=='none')teaser.classList.add('in');
  claim.classList.add('in');
  phase='ready';armTimer();
}

/* ---------- intro ---------- */
async function play(){
  if(phase==='intro')return;
  phase='intro';reset();
  popup.classList.add('open');       await wait(120);
  ribbon.classList.add('in');        await wait(90);
  hex.classList.add('in');           await wait(230);
  hex.classList.add('charge');       await wait(190);
  hex.classList.remove('in','charge');replay(hex,'slam');
  hexNum.textContent=currentLevel;replay(hexNum,'swap');replay(shock,'go');replay(ribGleam,'go');
  const hc=center(hex);flash();shake();
  ring(hc.x,hc.y);burst(hc,{count:24,radius:110,dur:720});
  await wait(300);

  const chips=[...chipRow.children];
  chips.forEach((c,i)=>{const id=setTimeout(()=>c.classList.add('in'),(i*58)/speed);timers.push(id)});
  await wait(chips.length*58+120);

  if(featCard.style.display!=='none'){
    featCard.classList.add('in');await wait(170);
    if(featCard.dataset.earned==='1'){
      replay(featCard.querySelector('.laneShine'),'go');
      const ic=center(featCard.querySelector('.featIcon'));
      ring(ic.x,ic.y);burst(ic,{count:18,radius:56,dur:580});
      await wait(150);
    }else await wait(70);
    if(teaser.style.display!=='none'){teaser.classList.add('in');await wait(120)}
  }

  claim.classList.add('in');
  const nudge=setTimeout(()=>{if(phase==='ready')replay(claim,'nudge')},260/speed);timers.push(nudge);
  phase='ready';armTimer();
}

/* ---------- dismiss ---------- */
async function dismiss(reason){
  if(phase!=='ready')return;
  phase='outro';stopTimer();clearTimeout(openTimer);closeInfo();
  autoclose.classList.remove('in');

  if(reason==='claim'){
    claim.classList.add('pressed');await wait(110);claim.classList.remove('pressed');
    // reward chips collect upward
    [...chipRow.children].forEach((c,i)=>{
      const id=setTimeout(()=>{const p=center(c);riseAway(p,{count:8,gold:c.classList.contains('r-rare')?false:true});c.style.transition='transform .2s, opacity .2s';c.style.transform='translateY(-10px) scale(1.12)';c.style.opacity='0'},(i*45)/speed);timers.push(id);
    });
    if(featCard.dataset.earned==='1'){const ic=center(featCard.querySelector('.featIcon'));const id=setTimeout(()=>{replay(featCard.querySelector('.laneShine'),'go');ring(ic.x,ic.y);burst(ic,{count:16,radius:60,dur:600})},180/speed);timers.push(id)}
    await wait(420);
  }
  popup.classList.remove('open');popup.classList.add('closing');
  await wait(230);
  phase='idle';
}

/* ---------- input ---------- */
popup.addEventListener('pointerdown',e=>{
  if(phase==='intro'){e.preventDefault();skipToEnd()}
},true);
claim.onclick=()=>dismiss('claim');
xbtn.onclick=()=>{ if(phase==='intro')skipToEnd(); dismiss('x'); };

/* ---------- switcher ---------- */
function forceIdle(){clearAll();stopTimer();phase='idle'}
function setVariant(v){
  variant=v;
  $('vFeature').classList.toggle('active',v==='feature');$('vFeature').classList.toggle('gray',v!=='feature');
  $('vPlain').classList.toggle('active',v==='plain');$('vPlain').classList.toggle('gray',v!=='plain');
  forceIdle();play();
}
$('vFeature').onclick=()=>setVariant('feature');
$('vPlain').onclick=()=>setVariant('plain');
$('replay').onclick=()=>{forceIdle();play()};
document.querySelectorAll('.speed').forEach(b=>b.onclick=()=>{document.querySelectorAll('.speed').forEach(x=>x.classList.remove('active'));b.classList.add('active');speed=+b.dataset.speed});

setVariant('feature');
})();
</script>
</body>
</html>
